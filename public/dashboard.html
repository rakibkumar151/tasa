<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FP Tracker — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg      : #0a0c10;
      --surface : #111419;
      --card    : #161b22;
      --border  : rgba(255,255,255,0.07);
      --accent  : #58a6ff;
      --accent2 : #bc8cff;
      --green   : #3fb950;
      --yellow  : #d29922;
      --red     : #f85149;
      --text    : #e6edf3;
      --muted   : #7d8590;
      --hover   : rgba(88,166,255,0.07);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; }

    /* ── Layout ── */
    .layout { display: grid; grid-template-columns: 320px 1fr; height: 100vh; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 20px 18px 16px;
      border-bottom: 1px solid var(--border);
      flex: none;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .brand-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .brand-name { font-weight: 700; font-size: 15px; letter-spacing: -0.3px; }
    .brand-sub  { font-size: 11px; color: var(--muted); }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    .status-dot.disconnected { background: var(--red); animation: none }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(63,185,80,0.5) }
      50% { box-shadow: 0 0 0 5px rgba(63,185,80,0) }
    }
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      flex: none;
    }
    .stat-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .stat-val { font-size: 22px; font-weight: 700; color: var(--accent); font-family: 'JetBrains Mono', monospace; }
    .stat-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

    .list-header {
      padding: 10px 18px 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .clear-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--red);
      font-size: 10px;
      font-family: 'Inter', sans-serif;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .clear-btn:hover { background: rgba(248,81,73,0.1) }

    .visitor-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 10px 10px;
    }
    .visitor-list::-webkit-scrollbar { width: 4px }
    .visitor-list::-webkit-scrollbar-track { background: transparent }
    .visitor-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px }

    .visitor-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      border: 1px solid transparent;
      margin-bottom: 2px;
    }
    .visitor-item:hover  { background: var(--hover) }
    .visitor-item.active { background: rgba(88,166,255,0.1); border-color: rgba(88,166,255,0.25) }
    .visitor-item.new-entry { animation: slide-in 0.3s ease-out }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-8px) }
      to   { opacity: 1; transform: translateY(0) }
    }
    .vi-avatar {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #fff;
      flex: none;
    }
    .vi-info { flex: 1; min-width: 0 }
    .vi-id   { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vi-meta { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vi-time { font-size: 10px; color: var(--muted); flex: none; }
    .new-badge {
      background: var(--green);
      color: #000;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 3px;
      flex: none;
      text-transform: uppercase;
    }

    /* ── Main Panel ── */
    .main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .main-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .main-title { font-size: 15px; font-weight: 600 }
    .main-sub   { font-size: 12px; color: var(--muted); margin-top: 2px }
    .confidence-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .confidence-badge.high   { background: rgba(63,185,80,0.15);  color: var(--green)  }
    .confidence-badge.medium { background: rgba(210,153,34,0.15); color: var(--yellow) }
    .confidence-badge.low    { background: rgba(248,81,73,0.15);  color: var(--red)    }

    .main-body  { flex: 1; overflow-y: auto; padding: 20px 24px }
    .main-body::-webkit-scrollbar { width: 4px }
    .main-body::-webkit-scrollbar-track { background: transparent }
    .main-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px }

    /* empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      text-align: center;
      gap: 12px;
    }
    .empty-state .icon { font-size: 48px; opacity: 0.4 }
    .empty-state h2 { font-size: 16px; font-weight: 600; color: var(--text); opacity: 0.5 }
    .empty-state p  { font-size: 13px; max-width: 320px; line-height: 1.6 }

    /* detail sections */
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .kv-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }
    .kv-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px }
    .kv-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--text);
      word-break: break-all;
      line-height: 1.4;
    }
    .kv-value.accent  { color: var(--accent) }
    .kv-value.accent2 { color: var(--accent2) }
    .kv-value.green   { color: var(--green) }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 20px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* JSON viewer */
    .json-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .json-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }
    .json-toolbar-label { font-size: 11px; color: var(--muted); font-weight: 500 }
    .copy-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      font-family: 'Inter', sans-serif;
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .copy-btn:hover { background: var(--hover); color: var(--text) }
    .copy-btn.copied { color: var(--green); border-color: var(--green) }

    .json-content {
      padding: 16px;
      overflow-x: auto;
      max-height: 480px;
      overflow-y: auto;
    }
    .json-content::-webkit-scrollbar { width: 4px; height: 4px }
    .json-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px }
    pre.json {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      line-height: 1.7;
      white-space: pre;
      tab-size: 2;
    }
    /* syntax highlighting */
    .j-key    { color: #79c0ff }
    .j-str    { color: #a5d6ff }
    .j-num    { color: #f2cc60 }
    .j-bool   { color: #ff7b72 }
    .j-null   { color: #8b949e }

    /* toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--green);
      color: #000;
      font-weight: 600;
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 8px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateY(0) }

    /* no-key overlay */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .overlay-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 40px;
      text-align: center;
      max-width: 380px;
      width: 90%;
    }
    .overlay-card h2 { font-size: 18px; margin-bottom: 8px }
    .overlay-card p  { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.6 }
    .key-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .key-input:focus { border-color: var(--accent) }
    .key-submit {
      width: 100%;
      background: var(--accent);
      color: #000;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 14px;
      border: none;
      border-radius: 8px;
      padding: 11px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .key-submit:hover { opacity: 0.85 }
    .key-error { color: var(--red); font-size: 12px; margin-top: 8px }
  </style>
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-icon">🕵️</div>
        <div>
          <div class="brand-name">FP Tracker</div>
          <div class="brand-sub">Realtime Fingerprint Dashboard</div>
        </div>
      </div>
      <div class="status-bar">
        <div class="status-dot disconnected" id="statusDot"></div>
        <span id="statusText">Disconnected</span>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-val" id="totalCount">0</div>
        <div class="stat-lbl">Total Visitors</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="sessionCount" style="color:var(--green)">0</div>
        <div class="stat-lbl">This Session</div>
      </div>
    </div>

    <div class="list-header">
      <span>Visitors</span>
      <button class="clear-btn" id="clearBtn">Clear All</button>
    </div>

    <div class="visitor-list" id="visitorList">
      <!-- populated by JS -->
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="main-header">
      <div>
        <div class="main-title" id="detailTitle">Select a visitor</div>
        <div class="main-sub"  id="detailSub">Click any entry from the sidebar to inspect</div>
      </div>
      <div id="confidenceBadge"></div>
    </div>
    <div class="main-body" id="mainBody">
      <div class="empty-state" id="emptyState">
        <div class="icon">📡</div>
        <h2>Waiting for visitors</h2>
        <p>Open the stealth page in any browser. Fingerprint data will appear here in realtime.</p>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
;(function () {
  'use strict'

  // ── State ────────────────────────────────────────────────────────────────────
  let entries     = []     // all fingerprints (newest first)
  let activeId    = null
  let sessionNew  = 0
  let evtSource   = null

  // ── DOM refs ─────────────────────────────────────────────────────────────────
  const statusDot      = document.getElementById('statusDot')
  const statusText     = document.getElementById('statusText')
  const totalCount     = document.getElementById('totalCount')
  const sessionCount   = document.getElementById('sessionCount')
  const visitorList    = document.getElementById('visitorList')
  const detailTitle    = document.getElementById('detailTitle')
  const detailSub      = document.getElementById('detailSub')
  const mainBody       = document.getElementById('mainBody')
  const emptyState     = document.getElementById('emptyState')
  const confidenceBadge= document.getElementById('confidenceBadge')
  const clearBtn       = document.getElementById('clearBtn')
  const toast          = document.getElementById('toast')

  // ── Auth ─────────────────────────────────────────────────────────────────────
  connect()

  // ── SSE Connection ───────────────────────────────────────────────────────────
  function connect() {
    if (evtSource) evtSource.close()
    evtSource = new EventSource('/events')

    evtSource.onopen = function () {
      statusDot.classList.remove('disconnected')
      statusText.textContent = 'Live'
    }

    evtSource.onmessage = function (e) {
      const entry = JSON.parse(e.data)

      if (entry._clear) {
        entries = []
        visitorList.innerHTML = ''
        totalCount.textContent  = '0'
        sessionCount.textContent = '0'
        sessionNew = 0
        renderEmpty()
        return
      }

      const isHistory = entry._history === true
      if (isHistory) delete entry._history

      // deduplicate
      if (entries.find(x => x.id === entry.id)) return

      entries.unshift(entry)
      totalCount.textContent = entries.length

      if (!isHistory) {
        sessionNew++
        sessionCount.textContent = sessionNew
        showToast('New visitor fingerprinted!')
        renderSidebarItem(entry, true)
        if (entries.length === 1) hideEmpty()
      } else {
        renderSidebarItem(entry, false)
        if (entries.length === 1) hideEmpty()
      }
    }

    evtSource.onerror = function () {
      statusDot.classList.add('disconnected')
      statusText.textContent = 'Reconnecting...'
    }
  }

  // ── Sidebar ──────────────────────────────────────────────────────────────────
  function renderSidebarItem(entry, isNew) {
    const vId   = (entry.data && entry.data.visitorId) ? entry.data.visitorId : '—'
    const label = vId !== '—' ? vId.slice(0, 8) + '…' : entry.id.slice(0, 8) + '…'
    const letter= vId !== '—' ? vId[0].toUpperCase() : '?'
    const time  = formatTime(entry.timestamp)
    const ip    = entry.ip || '?'

    const el = document.createElement('div')
    el.className = 'visitor-item' + (isNew ? ' new-entry' : '')
    el.dataset.id = entry.id
    el.innerHTML = `
      <div class="vi-avatar" style="background:${avatarGradient(vId)}">${letter}</div>
      <div class="vi-info">
        <div class="vi-id">${escHtml(label)}</div>
        <div class="vi-meta">${escHtml(ip)}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <div class="vi-time">${time}</div>
        ${isNew ? '<div class="new-badge">NEW</div>' : ''}
      </div>
    `
    el.addEventListener('click', function () { selectEntry(entry.id) })

    // prepend (newest first)
    if (visitorList.firstChild) {
      visitorList.insertBefore(el, visitorList.firstChild)
    } else {
      visitorList.appendChild(el)
    }

    // auto-select first new entry
    if (isNew && !activeId) selectEntry(entry.id)
  }

  function selectEntry(id) {
    activeId = id
    document.querySelectorAll('.visitor-item').forEach(el => {
      el.classList.toggle('active', el.dataset.id === id)
    })
    const entry = entries.find(e => e.id === id)
    if (entry) renderDetail(entry)
  }

  // ── Detail Panel ─────────────────────────────────────────────────────────────
  function renderDetail(entry) {
    const d    = entry.data || {}
    const vId  = d.visitorId || '—'
    const conf = d.confidence || {}
    const score= conf.score != null ? conf.score : null
    const nav  = d.navigator  || {}
    const scr  = d.screen     || {}
    const tim  = d.timing     || {}
    const url  = d.url        || {}

    detailTitle.textContent = vId !== '—' ? vId : entry.id
    detailSub.textContent   = 'Collected ' + new Date(entry.timestamp).toLocaleString()

    // Confidence badge
    if (score !== null) {
      const pct   = Math.round(score * 100)
      const tier  = pct >= 80 ? 'high' : pct >= 50 ? 'medium' : 'low'
      confidenceBadge.innerHTML = `<span class="confidence-badge ${tier}">⬤ ${pct}% confidence</span>`
    } else {
      confidenceBadge.innerHTML = ''
    }

    mainBody.innerHTML = ''

    // KV grid
    const grid = document.createElement('div')
    grid.className = 'detail-grid'
    grid.innerHTML = kvCard('Visitor ID',       vId,                    'accent')
             + kvCard('IP Address',        entry.ip || '—',        'accent2')
             + kvCard('Timezone',          tim.tz || '—',          'green')
             + kvCard('Language',          nav.language || '—',    '')
             + kvCard('Platform',          nav.platform || '—',    '')
             + kvCard('Screen',            scr.width && scr.height ? `${scr.width}×${scr.height}` : '—', '')
             + kvCard('CPU Threads',       nav.hardwareConcurrency != null ? String(nav.hardwareConcurrency) : '—', '')
             + kvCard('Device RAM',        nav.deviceMemory != null ? `${nav.deviceMemory} GB` : '—', '')
             + kvCard('Touch Points',      nav.maxTouchPoints != null ? String(nav.maxTouchPoints) : '—', '')
             + kvCard('Referrer',          url.referrer || '(direct)', '')
    mainBody.appendChild(grid)

    // User agent
    if (entry.userAgent) {
      addSection(mainBody, 'User Agent')
      const uaBox = document.createElement('div')
      uaBox.className = 'kv-card'
      uaBox.style.marginBottom = '0'
      uaBox.innerHTML = `<div class="kv-value" style="font-size:12px;color:var(--muted)">${escHtml(entry.userAgent)}</div>`
      mainBody.appendChild(uaBox)
    }

    // Components JSON
    if (d.components) {
      addSection(mainBody, 'Entropy Components')
      addJsonBox(mainBody, d.components, 'components')
    }

    // Full JSON
    addSection(mainBody, 'Full Raw Payload')
    addJsonBox(mainBody, entry, 'raw_' + entry.id)
  }

  function kvCard(label, value, colorClass) {
    return `<div class="kv-card">
      <div class="kv-label">${escHtml(label)}</div>
      <div class="kv-value ${colorClass}">${escHtml(value)}</div>
    </div>`
  }

  function addSection(parent, title) {
    const el = document.createElement('div')
    el.className = 'section-title'
    el.textContent = title
    parent.appendChild(el)
  }

  function addJsonBox(parent, data, id) {
    const box = document.createElement('div')
    box.className = 'json-box'

    const toolbar = document.createElement('div')
    toolbar.className = 'json-toolbar'
    toolbar.innerHTML = `
      <span class="json-toolbar-label">JSON</span>
      <button class="copy-btn" id="copy_${id}">Copy</button>
    `
    box.appendChild(toolbar)

    const content = document.createElement('div')
    content.className = 'json-content'
    const pre = document.createElement('pre')
    pre.className = 'json'
    const raw = JSON.stringify(data, null, 2)
    pre.innerHTML = syntaxHighlight(raw)
    content.appendChild(pre)
    box.appendChild(content)

    parent.appendChild(box)
    box.style.marginBottom = '20px'

    document.getElementById('copy_' + id)?.addEventListener('click', function () {
      copyText(raw, this)
    })
  }

  // ── Helpers ──────────────────────────────────────────────────────────────────
  function hideEmpty()  { emptyState.style.display = 'none' }
  function renderEmpty() {
    mainBody.innerHTML = ''
    mainBody.appendChild(emptyState)
    emptyState.style.display = 'flex'
    detailTitle.textContent = 'Select a visitor'
    detailSub.textContent   = 'Click any entry from the sidebar to inspect'
    confidenceBadge.innerHTML = ''
    activeId = null
  }

  function formatTime(iso) {
    const d = new Date(iso)
    const now = new Date()
    const diff = Math.floor((now - d) / 1000)
    if (diff < 60)   return diff + 's ago'
    if (diff < 3600) return Math.floor(diff/60) + 'm ago'
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  }

  function avatarGradient(seed) {
    const hues = [213, 265, 160, 24, 340]
    let h = 0
    for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) | 0
    const idx = Math.abs(h) % hues.length
    return `linear-gradient(135deg, hsl(${hues[idx]},80%,55%), hsl(${(hues[idx]+60)%360},80%,65%))`
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  }

  function syntaxHighlight(json) {
    return escHtml(json).replace(
      /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
      function (match) {
        if (/^"/.test(match)) {
          if (/:$/.test(match)) return '<span class="j-key">' + match + '</span>'
          return '<span class="j-str">' + match + '</span>'
        }
        if (/true|false/.test(match)) return '<span class="j-bool">' + match + '</span>'
        if (/null/.test(match))       return '<span class="j-null">' + match + '</span>'
        return '<span class="j-num">' + match + '</span>'
      }
    )
  }

  function copyText(text, btn) {
    navigator.clipboard.writeText(text).then(function () {
      const orig = btn.textContent
      btn.textContent = '✓ Copied'
      btn.classList.add('copied')
      setTimeout(function () {
        btn.textContent = orig
        btn.classList.remove('copied')
      }, 1800)
    })
  }

  let toastTimer
  function showToast(msg) {
    clearTimeout(toastTimer)
    toast.textContent = msg
    toast.classList.add('show')
    toastTimer = setTimeout(function () { toast.classList.remove('show') }, 2400)
  }

  // ── Clear ────────────────────────────────────────────────────────────────────
  clearBtn.addEventListener('click', function () {
    if (!confirm('Delete all stored fingerprints?')) return
    fetch('/api/records', { method: 'DELETE' })
      .then(function () {
        entries = []
        visitorList.innerHTML = ''
        totalCount.textContent = '0'
        sessionCount.textContent = '0'
        sessionNew = 0
        renderEmpty()
      })
  })

})()
</script>
</body>
</html>
